name: "Sales lead intake extraction"
description: "Extract a consistent JSON payload from messy inbound lead emails. Deterministic scoring for CI gating."

# Output keys (v1):
# - lead_name (string)
# - lead_email (string)
# - summary (string)
# - company (string, optional)
# - budget (string, optional)
# - timeline (string, optional)
# - project_type (string, optional)
#
# Rule: return ALL keys. If a value is unknown, use an empty string.

cases:
  - id: "basic_new_site"
    prompt:
      system: |
        You are a careful information extraction system.
        Return ONLY valid JSON. No markdown. No extra text.
        Return ALL keys. Use empty string for unknown values.
      user: |
        Extract lead fields from the email.

        Email:
        ---
        Hi, this is Jordan Lee (jordan@example.com). We're looking to redesign our website and add a booking form.
        Timeline: next month.
        Budget is flexible.
        ---
    checks:
      - type: required_keys
        keys: [lead_name, lead_email, summary, company, budget, timeline, project_type]
      - type: regex
        pattern: '"lead_email"\s*:\s*"[^"]+@[^\"]+"'

  - id: "signature_block"
    prompt:
      system: |
        Return ONLY valid JSON. Return ALL keys.
      user: |
        Extract lead fields.

        Email:
        ---
        Hello,
        We need help improving our site speed and converting more traffic.

        Thanks,
        Priya N.
        priya.n@example.org
        ---
    checks:
      - type: required_keys
        keys: [lead_name, lead_email, summary, company, budget, timeline, project_type]
      - type: regex
        pattern: '"lead_email"\s*:\s*"[^"]+@[^\"]+"'

  - id: "multiple_people_in_thread"
    prompt:
      system: |
        Return ONLY valid JSON. Return ALL keys.
      user: |
        Extract the lead (the person requesting work) from the email.

        Email:
        ---
        CC'ing Alex and Sam.
        Hi, I'm Morgan (morgan@acme.co) — can you quote a website upgrade and ongoing maintenance?
        ---
    checks:
      - type: required_keys
        keys: [lead_name, lead_email, summary, company, budget, timeline, project_type]

